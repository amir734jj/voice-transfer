name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            channel: win
            mainExe: VoiceTransfer.exe
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux
            mainExe: VoiceTransfer
          - os: macos-latest
            rid: osx-x64
            channel: osx
            mainExe: VoiceTransfer
          - os: macos-latest
            rid: osx-arm64
            channel: osx-arm64
            mainExe: VoiceTransfer

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/VoiceTransfer/VoiceTransfer.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        shell: bash
        run: |
          vpk download github --repoUrl https://github.com/${{ github.repository }} --channel ${{ matrix.channel }} --token ${{ secrets.GITHUB_TOKEN }} || true
          vpk pack -u VoiceTransfer -v 1.0.${{ github.run_number }} -p src/VoiceTransfer/bin/Release/net10.0/${{ matrix.rid }}/publish -e ${{ matrix.mainExe }} --channel ${{ matrix.channel }}

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.channel }}
          path: Releases/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all Velopack artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VoiceTransfer v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: artifacts/**/*
